<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Quick Grid</title>
  <style>
    :root { --bg:#090b12; --panel:#111522; --border:#27304a; --text:#ebefff; --muted:#98a3c7; --accent:#6f8cff; }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top right,#1c2548 0%,#0e1220 42%,var(--bg) 100%);color:var(--text)}
    .wrap{max-width:1200px;margin:0 auto;padding:14px}
    .panel{background:linear-gradient(180deg,rgba(22,28,44,.92),rgba(14,18,30,.95));border:1px solid var(--border);border-radius:14px;padding:12px}
    .controls{display:grid;grid-template-columns:1fr 220px auto;gap:8px;margin-top:10px}
    input,select,button{border:1px solid var(--border);border-radius:10px;background:#0f1322;color:var(--text);padding:10px 12px}
    button{cursor:pointer}
    .layout{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    .player{background:#000;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .player-head{padding:8px 10px;background:#0f1322;border-bottom:1px solid var(--border)}
    .player-title{margin:0;font-size:.9rem}
    .player-meta{font-size:.75rem;color:var(--muted)}
    iframe{width:100%;aspect-ratio:16/9;border:0;background:#000}
    .fallback{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted)}
    .fallback a{color:#cfe0ff}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;display:grid;gap:8px;cursor:pointer}
    .card h3{margin:0;font-size:.9rem}
    .desc{margin:0;color:var(--muted);font-size:.78rem}
    .actions{display:flex;gap:6px}
    .open{background:linear-gradient(180deg,#5e79f5,#4a63cf);border-color:#4861ca}
    @media (max-width:900px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:560px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1 style="margin:0 0 6px">IPTV Quick Grid</h1>
      <p style="margin:0;color:#98a3c7">Canale sus, player in pagina + fallback extern.</p>
      <div class="controls">
        <input id="searchInput" placeholder="Cauta post..." />
        <select id="categorySelect"><option value="all">Toate categoriile</option></select>
        <button id="showFavorites">★ Doar favorite</button>
      </div>
    </section>

    <div class="layout">
      <section class="player" id="playerPanel">
        <div class="player-head">
          <h2 class="player-title" id="playerTitle">Selecteaza un canal</h2>
          <div class="player-meta" id="playerMeta">Preview live</div>
        </div>
        <iframe id="playerFrame" title="IPTV Preview" allow="autoplay; fullscreen"></iframe>
        <div class="fallback" id="playerFallback" hidden>
          <span>Daca nu merge in pagina, deschide extern:</span>
          <span>
            <a id="openExternalStream" href="#" target="_blank" rel="noopener">Primar ↗</a> ·
            <a id="openExternalFallback" href="#" target="_blank" rel="noopener">Fallback IP ↗</a>
          </span>
        </div>
      </section>

      <section class="grid" id="channelGrid"></section>
    </div>
  </div>

  <script>
    const FALLBACK_STREAM_HOST = '95.215.19.22';
    const FALLBACK_STREAM_PROTOCOL = 'http:';

    const channels = [
      {name:'PROTV HD',embed:'https://canale-tv.com/channel/pr0tv.html',category:'General',description:'General entertainment and news.'},
      {name:'A1 HD',embed:'https://canale-tv.com/channel/a1.html',category:'General',description:'Popular Romanian TV content.'},
      {name:'TVR1',embed:'https://canale-tv.com/channel/tvr1.html',category:'General',description:'Public broadcaster.'},
      {name:'DIGI SPORT 1',embed:'https://canale-tv.com/channel/dgsp1.html',category:'Sports',description:'Live sports.'},
      {name:'FILM CAFE',embed:'https://canale-tv.com/channel/filmcafe.html',category:'Movies',description:'Movies and classics.'},
      {name:'BBC NEWS',embed:'https://canale-tv.com/channel/bbcnews.html',category:'News',description:'International news.'}
    ];

    const els = {
      grid: document.getElementById('channelGrid'),
      search: document.getElementById('searchInput'),
      category: document.getElementById('categorySelect'),
      frame: document.getElementById('playerFrame'),
      title: document.getElementById('playerTitle'),
      meta: document.getElementById('playerMeta'),
      fallback: document.getElementById('playerFallback'),
      openExternal: document.getElementById('openExternalStream'),
      openFallback: document.getElementById('openExternalFallback')
    };

    const state = { search:'', category:'all' };

    function buildStreamUrl(url, forceFallback=false) {
      const u = new URL(url);
      if (forceFallback && u.hostname === 'canale-tv.com') {
        u.protocol = FALLBACK_STREAM_PROTOCOL;
        u.hostname = FALLBACK_STREAM_HOST;
      }
      u.searchParams.set('autoplay','1');
      u.searchParams.set('play','1');
      return u.toString();
    }

    function openStream(c) {
      const primary = buildStreamUrl(c.embed);
      const fallback = buildStreamUrl(c.embed, true);
      els.title.textContent = c.name;
      els.meta.textContent = `${c.category} • ${c.description}`;
      els.frame.src = primary;
      els.openExternal.href = primary;
      els.openFallback.href = fallback;
      els.fallback.hidden = false;
    }

    function filtered() {
      const q = state.search.toLowerCase();
      return channels.filter(c =>
        (state.category === 'all' || c.category === state.category) &&
        (c.name.toLowerCase().includes(q) || c.description.toLowerCase().includes(q))
      );
    }

    function render() {
      els.grid.innerHTML = '';
      const list = filtered();
      if (!list.length) { els.grid.innerHTML = '<div class="card">Nu exista canale.</div>'; return; }
      for (const c of list) {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <h3>${c.name}</h3>
          <p class="desc">${c.description}</p>
          <div class="actions"><button class="open" type="button">▶ Open stream</button></div>
        `;
        card.addEventListener('click', () => openStream(c));
        card.querySelector('.open').addEventListener('click', (e) => { e.stopPropagation(); openStream(c); });
        els.grid.append(card);
      }
    }

    function initCategories() {
      const categories = [...new Set(channels.map(c => c.category))].sort();
      for (const cat of categories) {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        els.category.append(opt);
      }
    }

    els.search.addEventListener('input', e => { state.search = e.target.value.trim(); render(); });
    els.category.addEventListener('change', e => { state.category = e.target.value; render(); });

    initCategories();
    render();
  </script>
</body>
</html>
